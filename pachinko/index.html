<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akita Pachinko</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="machine">
    <header class="machine__header">
      <p class="eyebrow">SAY-さい- MINI GAME</p>
      <h1>AKITA PACHINKO</h1>
      <p class="muted">演出・抽選・物理演算テスト</p>
    </header>

    <section class="settings" aria-label="ゲーム設定">
      <label for="rate">1回転あたりのレート（Token）</label>
      <div class="settings__row">
        <input id="rate" type="number" min="1" step="1" value="1">
        <button id="start-button" type="button">玉を発射</button>
      </div>
      <p class="muted">テストモード：現在はToken残高を消費・加算しません。</p>
    </section>

    <section class="reel-panel" aria-label="図柄表示">
      <p class="reel-panel__label">RESULT</p>
      <div class="reels" aria-live="polite">
        <span class="reel" id="reel-left">?</span>
        <span class="reel" id="reel-center">?</span>
        <span class="reel" id="reel-right">?</span>
      </div>
      <p id="route-label" class="route-label">発射すると抽選します</p>
      <p id="result-label" class="result-label">—</p>
    </section>

    <section class="stats" aria-label="テスト統計">
      <div><span>回転数</span><strong id="spin-count">0</strong></div>
      <div><span>リーチ</span><strong id="reach-count">0</strong></div>
      <div><span>大当たり</span><strong id="jackpot-count">0</strong></div>
      <div><span>当選率</span><strong id="jackpot-rate">0.00%</strong></div>
    </section>

    <section class="playfield" aria-label="パチンコ盤面">
      <canvas id="machine-canvas" width="420" height="640">
        Canvasに対応したブラウザで開いてください。
      </canvas>
      <div id="status" class="status" role="status">発射ボタンでテストできます</div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
