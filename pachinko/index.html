<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akita Pachinko</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="machine">
    <header class="machine__header">
      <p class="eyebrow">SAY-さい- MINI GAME</p>
      <h1>AKITA PACHINKO</h1>
      <p class="muted">連続打ち出し・入賞抽選テスト</p>
    </header>

    <section class="controls" aria-label="発射操作">
      <button id="start-button" class="launch-button" type="button" aria-pressed="false">打ち出し ON</button>
      <p id="status" class="status" role="status">打ち出しONで玉が流れます。ヘソ入賞で抽選開始！</p>
      <p class="test-note">テストモード：Token残高は変化しません</p>
    </section>

    <section class="playfield" aria-label="パチンコ盤面">
      <canvas id="machine-canvas" width="420" height="640">
        Canvasに対応したブラウザで開いてください。
      </canvas>
      <section class="reel-panel" aria-label="液晶・図柄表示">
        <p class="reel-panel__label">AKITA CHANCE</p>
        <div class="reels" aria-live="polite">
          <span class="reel" id="reel-left">—</span>
          <span class="reel" id="reel-center">—</span>
          <span class="reel" id="reel-right">—</span>
        </div>
        <p id="route-label" class="route-label">START</p>
        <p id="result-label" class="result-label">ヘソ入賞を待っています</p>
      </section>
      <div class="hold-panel" aria-label="保留">
        <span class="hold-title">保留</span>
        <span id="hold-count" class="hold-count">0 / 4</span>
        <div id="hold-lamps" class="hold-lamps">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="テスト統計">
      <div><span>回転数</span><strong id="spin-count">0</strong></div>
      <div><span>リーチ</span><strong id="reach-count">0</strong></div>
      <div><span>大当たり</span><strong id="jackpot-count">0</strong></div>
      <div><span>当選率</span><strong id="jackpot-rate">0.00%</strong></div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
